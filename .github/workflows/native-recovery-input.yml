name: Native Recovery input review
on:
  push:
    branches: [ci/native-recovery-review]
    paths: [.github/workflows/native-recovery-input.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      XCODEBUILDMCP_SENTRY_DISABLED: 'true'
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: aurora-silicon/omarchy-mac
          ref: faac97ee46fc44ff323bff8aabbd8db45ea402a9
          path: source
          persist-credentials: false
      - name: Record immutable source and tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/tools"
          { git rev-parse HEAD; sw_vers; uname -m; xcodebuild -version; xcrun swift --version; xcrun swift-format --version; } > "$RUNNER_TEMP/evidence/toolchain.txt"
          [[ $(uname -m) == arm64 ]]
          cd "$RUNNER_TEMP/tools"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/getsentry/XcodeBuildMCP/releases/download/v2.7.0/xcodebuildmcp-2.7.0-darwin-arm64.tar.gz -o tool.tar.gz
          echo 'bd724a2c0e6ffe027b3f46257e66d626149a64cd045f4867124bd683b3cf081a  tool.tar.gz' | shasum -a 256 -c -
          tar -xzf tool.tar.gz
          echo "$PWD/xcodebuildmcp-2.7.0-darwin-arm64/bin" >> "$GITHUB_PATH"
      - name: Format with Xcode
        run: |
          set -euo pipefail
          xcrun swift-format format -i --recursive Package.swift Sources Plugins Tests
          git diff --binary > "$RUNNER_TEMP/evidence/format.patch"
          xcrun swift-format lint --strict --recursive Package.swift Sources Plugins Tests
      - name: Test template admission and execution in both configurations
        run: |
          set -euo pipefail
          xcodebuildmcp swift-package test --package-path "$PWD" --configuration debug \
            --filter 'NativeRecoveryTemplateTests|PinnedAsahiEngineExecutorTests|EngineHandoffPackageImporterTests|ClosedEngineHandoffProcessTests|RecoveryAccountTests' 2>&1 | tee "$RUNNER_TEMP/evidence/debug.log"
          xcodebuildmcp swift-package test --package-path "$PWD" --configuration release \
            --filter 'NativeRecoveryTemplateTests|PinnedAsahiEngineExecutorTests|EngineHandoffPackageImporterTests|ClosedEngineHandoffProcessTests|RecoveryAccountTests' 2>&1 | tee "$RUNNER_TEMP/evidence/release.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-recovery-input-evidence
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
