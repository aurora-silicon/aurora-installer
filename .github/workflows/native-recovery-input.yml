name: Native Recovery input review
on:
  push:
    branches: [ci/native-recovery-review]
    paths: [.github/workflows/native-recovery-input.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      XCODEBUILDMCP_SENTRY_DISABLED: 'true'
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: aurora-silicon/omarchy-mac
          ref: a1a13e671dce475afab1a6478af15c5da1faf2a1
          path: source
          persist-credentials: false
      - name: Record immutable source and tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/tools"
          { git rev-parse HEAD; sw_vers; uname -m; xcodebuild -version; xcrun swift --version; xcrun swift-format --version; } > "$RUNNER_TEMP/evidence/toolchain.txt"
          [[ $(uname -m) == arm64 ]]
          cd "$RUNNER_TEMP/tools"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/getsentry/XcodeBuildMCP/releases/download/v2.7.0/xcodebuildmcp-2.7.0-darwin-arm64.tar.gz -o tool.tar.gz
          echo 'bd724a2c0e6ffe027b3f46257e66d626149a64cd045f4867124bd683b3cf081a  tool.tar.gz' | shasum -a 256 -c -
          tar -xzf tool.tar.gz
          echo "$PWD/xcodebuildmcp-2.7.0-darwin-arm64/bin" >> "$GITHUB_PATH"
      - name: Format with Xcode
        run: |
          set -euo pipefail
          xcrun swift-format format -i --recursive Package.swift Sources Plugins Tests
          git diff --binary > "$RUNNER_TEMP/evidence/format.patch"
          xcrun swift-format lint --strict --recursive Package.swift Sources Plugins Tests
          [[ ! -s "$RUNNER_TEMP/evidence/format.patch" ]]
      - name: Qualify all Swift tests in both configurations
        run: |
          set -euo pipefail
          xcodebuildmcp swift-package test --package-path "$PWD" --configuration debug 2>&1 | tee "$RUNNER_TEMP/evidence/debug.log"
          xcodebuildmcp swift-package test --package-path "$PWD" --configuration release 2>&1 | tee "$RUNNER_TEMP/evidence/release.log"
      - name: Build and verify native Recovery enrollment
        run: |
          set -euo pipefail
          bash Recovery/build-app.sh recovery "$RUNNER_TEMP/evidence/recovery-enrollment" 2>&1 | tee "$RUNNER_TEMP/evidence/recovery-enrollment.log"
          OMARCHY_RECOVERY_BUILD=preview xcodebuildmcp swift-package build --package-path "$PWD/Recovery" --configuration release 2>&1 | tee "$RUNNER_TEMP/evidence/recovery-preview.log"
      - name: Reproduce the pinned engine
        run: |
          set -euo pipefail
          python3 Engine/prepare-engine.py --output Engine/artifacts 2>&1 | tee "$RUNNER_TEMP/evidence/engine-reproduction.log"
          python3 Engine/verify-engine-macho.py --signatures Engine/artifacts/*.tar.gz 2>&1 | tee "$RUNNER_TEMP/evidence/runtime-signatures.log"
      - name: Assemble and inspect the application
        run: |
          set -euo pipefail
          source Packaging/identity.conf
          export OMARCHY_RECOVERY_TEMPLATE="$RUNNER_TEMP/evidence/recovery-enrollment/$INSTALLER_RECOVERY_APP_NAME.app"
          bash Packaging/validate-app-assembly.sh "$RUNNER_TEMP/app-assembly" 2>&1 | tee "$RUNNER_TEMP/evidence/app-assembly.log"
          python3 Engine/verify-engine-macho.py --signatures "$RUNNER_TEMP/app-assembly/app/$INSTALLER_APP_NAME.app/Contents/Resources/Engine/artifacts/"*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-recovery-input-evidence
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
