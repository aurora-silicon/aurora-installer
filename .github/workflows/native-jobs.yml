name: Native installer job iteration
on:
  push:
    branches: [feat/native-firmware-wiring]
    paths: [macOS/Sources/**, macOS/Tests/**, macOS/Package.swift, .github/workflows/native-jobs.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jobs:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: macOS
    env:
      XCODEBUILDMCP_SENTRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned native build driver
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/evidence"
          cd "$RUNNER_TEMP/tools"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/getsentry/XcodeBuildMCP/releases/download/v2.7.0/xcodebuildmcp-2.7.0-darwin-arm64.tar.gz -o tool.tar.gz
          echo 'bd724a2c0e6ffe027b3f46257e66d626149a64cd045f4867124bd683b3cf081a  tool.tar.gz' | shasum -a 256 -c -
          tar -xzf tool.tar.gz
          echo "$PWD/xcodebuildmcp-2.7.0-darwin-arm64/bin" >> "$GITHUB_PATH"
      - name: Record source and native toolchain
        run: |
          { git rev-parse HEAD; sw_vers; uname -m; xcrun swift --version; xcodebuild -version; } > "$RUNNER_TEMP/evidence/toolchain.txt"
      - name: Format with Xcode and retain the exact correction
        run: |
          xcrun swift-format format -i --recursive Package.swift Sources Plugins Tests
          git diff --binary > "$RUNNER_TEMP/evidence/format.patch"
          xcrun swift-format lint --strict --recursive Package.swift Sources Plugins Tests
      - name: Test helper persistence and GUI restoration
        run: |
          set -euo pipefail
          xcodebuildmcp swift-package test --package-path "$PWD" --configuration debug \
            --filter 'AuroraFirmwareTests|InstallerJobTests|ClosedEngineHelperServerTests|InstallerSessionTests|EngineHandoffPackageImporterTests|PinnedAsahiEngineExecutorTests' 2>&1 | tee "$RUNNER_TEMP/evidence/debug.log"
          xcodebuildmcp swift-package test --package-path "$PWD" --configuration release \
            --filter 'AuroraFirmwareTests|InstallerJobTests|ClosedEngineHelperServerTests|InstallerSessionTests|EngineHandoffPackageImporterTests|PinnedAsahiEngineExecutorTests' 2>&1 | tee "$RUNNER_TEMP/evidence/release.log"
      - name: Check firmware recipe from an isolated executable
        run: |
          set -euo pipefail
          binary_dir="$(xcrun swift build --configuration release --show-bin-path)"
          isolated="$(mktemp -d)"
          trap 'rm -rf "$isolated"' EXIT
          cp "$binary_dir/AuroraFirmwareCheck" "$isolated/firmware-check"
          cd "$isolated"
          ./firmware-check plan > "$RUNNER_TEMP/evidence/embedded-recipe.json"
          python3 - "$RUNNER_TEMP/evidence/embedded-recipe.json" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1]))
          assert value == {"deviceIdentifier":"apple,j700","recipeSHA256":"595d5acf3c4bca51c5749fc45691a7873f9216e2527436be9101757aae472834","outputCount":13,"rangeBytes":15996940}
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-job-evidence
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
