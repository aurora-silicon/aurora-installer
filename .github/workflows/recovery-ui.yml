name: Recovery appearance and distribution icons
on:
  push:
    branches: [feat/native-firmware-wiring]
    paths: [macOS/Recovery/**, macOS/Packaging/DistributionIcons/**, macOS/scripts/assemble-distribution-payload.py, macOS/scripts/tests/test_distribution_payload.py, .github/workflows/recovery-ui.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jobs:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: macOS
    env:
      XCODEBUILDMCP_SENTRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned native build driver
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/evidence"
          cd "$RUNNER_TEMP/tools"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/getsentry/XcodeBuildMCP/releases/download/v2.7.0/xcodebuildmcp-2.7.0-darwin-arm64.tar.gz -o tool.tar.gz
          echo 'bd724a2c0e6ffe027b3f46257e66d626149a64cd045f4867124bd683b3cf081a  tool.tar.gz' | shasum -a 256 -c -
          tar -xzf tool.tar.gz
          echo "$PWD/xcodebuildmcp-2.7.0-darwin-arm64/bin" >> "$GITHUB_PATH"
      - name: Record source and native toolchain
        run: |
          { git rev-parse HEAD; sw_vers; uname -m; xcrun swift --version; xcodebuild -version; } > "$RUNNER_TEMP/evidence/toolchain.txt"
      - name: Format Recovery source and retain the exact correction
        run: |
          xcrun swift-format format -i --recursive Recovery/Package.swift Recovery/Sources Recovery/Tests
          git diff --binary > "$RUNNER_TEMP/evidence/format.patch"
          xcrun swift-format lint --strict --recursive Recovery/Package.swift Recovery/Sources Recovery/Tests
      - name: Verify distribution icons and authenticated payload fixtures
        run: python3 -m unittest discover -s scripts/tests -p test_distribution_payload.py
      - name: Build preview and Recovery modes and run pure fixtures
        run: |
          set -euo pipefail
          bash Recovery/build-preview.sh "$RUNNER_TEMP/recovery-preview" 2>&1 | tee "$RUNNER_TEMP/evidence/preview-build.log"
          bash Recovery/build-recovery.sh "$RUNNER_TEMP/recovery-template" 2>&1 | tee "$RUNNER_TEMP/evidence/recovery-build.log"
      - name: Render native Recovery preview in both appearances
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/recovery-preview/Aurora Installer.app"
          for screen in welcome installing account complete error; do
            for appearance in light dark; do
              output="$RUNNER_TEMP/evidence/$screen-$appearance.png"
              arguments=(--preview --preview-distro=fedora "--preview-stage=$screen" "--snapshot=$output")
              [[ $appearance != dark ]] || arguments+=(--preview-dark)
              "$app/Contents/MacOS/OmarchyRecovery" "${arguments[@]}" > "$RUNNER_TEMP/evidence/$screen-$appearance.log" 2>&1 &
              preview_pid=$!
              exited=0
              for attempt in {1..30}; do
                if ! kill -0 "$preview_pid" 2>/dev/null; then exited=1; break; fi
                sleep 1
              done
              if [[ $exited != 1 ]]; then
                ps -p "$preview_pid" -o pid,stat,command >> "$RUNNER_TEMP/evidence/$screen-$appearance.log"
                kill "$preview_pid" 2>/dev/null || true
                wait "$preview_pid" || true
                echo "Recovery preview timed out: $screen $appearance" >&2
                exit 1
              fi
              wait "$preview_pid"
              test -s "$output"
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: recovery-ui-evidence
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: native-recovery-template
          path: ${{ runner.temp }}/recovery-template/
          retention-days: 14
