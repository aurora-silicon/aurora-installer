name: Build native installer prerelease
on:
  workflow_dispatch:
    inputs:
      profiles-revision:
        description: Immutable aurora-distributions commit with matching signed catalogs
        required: true
      neo-reset-release-tag:
        description: Signed, non-adopted Neo Reset QA catalog release; empty for normal builds
        default: ''
        required: false
      version:
        description: Installer marketing version
        default: '0.1.0'
        required: true
      release-tag:
        description: Prerelease tag
        default: 'v0.1.0-alpha.4'
        required: true
      publish-release:
        description: Publish a prerelease after building; disable for a signed local rebuild
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: native-installer-dmg-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'aurora-silicon/aurora-installer'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      XCODEBUILDMCP_SENTRY_DISABLED: 'true'
      OMARCHY_DEVELOPER_BUILD: '1'
      AURORA_SIGNING_KEYCHAIN_TIMEOUT: '5400'
    defaults:
      run:
        shell: bash
        working-directory: macOS
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate immutable inputs
        env:
          PROFILES_REVISION: ${{ inputs.profiles-revision }}
          APP_VERSION: ${{ inputs.version }}
          NEO_RESET_TAG: ${{ inputs.neo-reset-release-tag }}
          PUBLISH_RELEASE: ${{ inputs.publish-release }}
        run: |
          set -euo pipefail
          [[ $PROFILES_REVISION =~ ^[0-9a-f]{40}$ ]]
          [[ $APP_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ -z $NEO_RESET_TAG || $PUBLISH_RELEASE == false ]]
          [[ $(uname -m) == arm64 ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: aurora-silicon/aurora-distributions
          ref: ${{ inputs.profiles-revision }}
          path: delivery
          sparse-checkout: site/installer/Profiles
          persist-credentials: false
      - name: Load the signed Alpha catalog set
        env:
          NEO_RESET_TAG: ${{ inputs.neo-reset-release-tag }}
        run: |
          set -euo pipefail
          if [[ ! -x /opt/homebrew/opt/openssl@3/bin/openssl ]]; then brew install openssl@3; fi
          directory="$RUNNER_TEMP/alpha-catalogs"
          mkdir -p "$directory"
          base=https://github.com/aurora-silicon/aurora-installer/releases/download/native-runtime-v0.9.2-aurora.14
          curl -fLsS --retry 3 "$base/runtime-manifest.json" -o "$directory/runtime-manifest.json"
          curl -fLsS --retry 3 "$base/runtime-manifest.json.sig" -o "$directory/runtime-manifest.json.sig"
          python3 - "$directory" <<'PYKEY'
          from pathlib import Path
          import sys
          public=Path('Release/trust-root.ed25519.pub').read_bytes()
          assert len(public)==32
          (Path(sys.argv[1])/'public.der').write_bytes(bytes.fromhex('302a300506032b6570032100')+public)
          PYKEY
          /opt/homebrew/opt/openssl@3/bin/openssl pkeyutl -verify -pubin -keyform DER \
            -inkey "$directory/public.der" -rawin -in "$directory/runtime-manifest.json" \
            -sigfile "$directory/runtime-manifest.json.sig"
          python3 - "$directory" "$base" <<'PYCATALOGS'
          import hashlib,json,sys,tarfile,urllib.request
          from pathlib import Path,PurePosixPath
          root=Path(sys.argv[1]);base=sys.argv[2]
          record=json.loads((root/'runtime-manifest.json').read_text())['assets']['alpha1-profiles.tar.gz']
          assert 0<record['bytes']<8<<20
          with urllib.request.urlopen(base+'/alpha1-profiles.tar.gz',timeout=60) as response:
              data=response.read((8<<20)+1)
          assert len(data)==record['bytes'] and hashlib.sha256(data).hexdigest()==record['sha256']
          archive=root/'alpha1-profiles.tar.gz';archive.write_bytes(data)
          with tarfile.open(archive) as source:
              members=source.getmembers();assert len(members)<=100
              for member in members:
                  path=PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert member.isfile() and 0<=member.size<=1<<20
                  output=root.joinpath(*path.parts);output.parent.mkdir(parents=True,exist_ok=True)
                  output.write_bytes(source.extractfile(member).read())
          PYCATALOGS
          if [[ -n $NEO_RESET_TAG ]]; then
            [[ $NEO_RESET_TAG =~ ^payload-(fedora|arch|nixos)-(kde|gnome|minimal)-[0-9]+-neo-reset-qa[0-9]*$ ]]
            qa_profile="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
            case ${BASH_REMATCH[1]} in
              fedora) qa_repository=fedora-aurora ;;
              arch) qa_repository=alarm-aurora ;;
              nixos) qa_repository=nixos-aurora ;;
            esac
            profile="$directory/Profiles/$qa_profile"
            base="https://github.com/aurora-silicon/$qa_repository/releases/download/$NEO_RESET_TAG"
            curl -fLsS --retry 3 "$base/catalog.json" -o "$directory/neo-reset-catalog.json"
            curl -fLsS --retry 3 "$base/catalog.json.sig" -o "$directory/neo-reset-catalog.json.sig"
            /opt/homebrew/opt/openssl@3/bin/openssl pkeyutl -verify -pubin -keyform DER \
              -inkey "$directory/public.der" -rawin -in "$directory/neo-reset-catalog.json" \
              -sigfile "$directory/neo-reset-catalog.json.sig"
            python3 - "$directory/neo-reset-catalog.json" "$NEO_RESET_TAG" "$qa_profile" <<'PYNEO'
          import json,re,sys
          from pathlib import Path
          catalog=json.loads(Path(sys.argv[1]).read_text());tag=sys.argv[2];profile=sys.argv[3]
          match=re.fullmatch(r'(payload-(?:fedora|arch|nixos)-(?:kde|gnome|minimal)-[0-9]+-neo-reset-qa)[0-9]*',tag)
          assert match
          asset_tags={tag,match.group(1)}
          models=catalog.get('models',[])
          assert catalog.get('schemaVersion')==4 and len(models)==1
          model=models[0]
          assert model['deviceIdentifier']=='apple,j700' and model['status']=='enabled'
          assert model['installationProfile']==profile
          for name in ('metadataArtifact','payloadArtifact'):
              assert any('/releases/download/'+asset_tag+'/' in model[name]['sourceURL']
                         for asset_tag in asset_tags)
          PYNEO
            cp "$directory/neo-reset-catalog.json" "$profile/catalog.json"
            cp "$directory/neo-reset-catalog.json.sig" "$profile/catalog.json.sig"
          fi
      - name: Require catalogs paired with this execution contract
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/alpha-catalogs/Profiles" <<'PY'
          import json,sys
          from pathlib import Path
          lock=json.loads(Path('Engine/source-lock.json').read_text())
          pin=lock['validation_artifact']
          profiles=Path(sys.argv[1])
          expected={f'{d}-{s}' for d in ('fedora','arch','nixos') for s in ('kde','gnome','minimal')}
          assert {p.name for p in profiles.iterdir()} == expected
          for profile in profiles.iterdir():
              catalog=json.loads((profile/'catalog.json').read_text())
              enabled=[m for m in catalog['models'] if m['status']=='enabled']
              assert enabled, profile.name
              for model in enabled:
                  assert model['engineVersion']==lock['downstream_overlay']['version'], profile.name
                  assert model['engineDigest']=='sha256:'+pin['sha256'], profile.name
                  assert model['engineArtifact']['fileName']==pin['filename'], profile.name
                  assert model['engineArtifact']['sizeBytes']==pin['size_bytes'], profile.name
          PY
      - name: Install the pinned native build driver
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/download"
          if [[ ! -x /opt/homebrew/bin/bash ]]; then brew install bash; fi
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          if [[ ! -x /opt/homebrew/opt/openssl@3/bin/openssl ]]; then brew install openssl@3; fi
          echo /opt/homebrew/opt/openssl@3/bin >> "$GITHUB_PATH"
          { git rev-parse HEAD; sw_vers; uname -m; xcodebuild -version; xcrun swift --version; } > "$RUNNER_TEMP/evidence/toolchain.txt"
          cd "$RUNNER_TEMP/tools"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/getsentry/XcodeBuildMCP/releases/download/v2.7.0/xcodebuildmcp-2.7.0-darwin-arm64.tar.gz -o tool.tar.gz
          echo 'bd724a2c0e6ffe027b3f46257e66d626149a64cd045f4867124bd683b3cf081a  tool.tar.gz' | shasum -a 256 -c -
          tar -xzf tool.tar.gz
          rm tool.tar.gz
          echo "$PWD/xcodebuildmcp-2.7.0-darwin-arm64/bin" >> "$GITHUB_PATH"
      - name: Qualify the immutable native candidate
        run: |
          set -euo pipefail
          xcrun swift-format lint --strict --recursive Package.swift Sources Plugins Tests Recovery/Package.swift Recovery/Sources Recovery/Tests
          xcodebuildmcp swift-package build --package-path "$PWD" --configuration release 2>&1 | tee "$RUNNER_TEMP/evidence/build.log"
          bash Recovery/build-recovery.sh "$RUNNER_TEMP/recovery-template" 2>&1 | tee "$RUNNER_TEMP/evidence/recovery.log"
      - name: Sign, notarize and package the tiny application
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          OMARCHY_APP_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/package.sh" <<'PACKAGE'
          #!/bin/bash
          set -euo pipefail
          source Packaging/identity.conf
          python3 scripts/prepare-distribution-release.py \
            --profiles "$RUNNER_TEMP/alpha-catalogs/Profiles" \
            --output "$RUNNER_TEMP/release" --sealed --signing-team "$OMARCHY_TEAM_ID"
          export OMARCHY_APP_BUILD_NUMBER=$(date -u +%y%m%d%H%M)
          export OMARCHY_RECOVERY_TEMPLATE="$RUNNER_TEMP/recovery-template/$INSTALLER_APP_NAME.app"
          bash Packaging/build-app.sh "$RUNNER_TEMP/release" "$RUNNER_TEMP/application"
          app="$RUNNER_TEMP/application/$INSTALLER_APP_NAME.app"
          bash Packaging/notarize-app.sh "$app"
          bash Packaging/make-download-dmg.sh "$app" "$RUNNER_TEMP/download/Aurora-Installer-$OMARCHY_APP_VERSION.dmg"
          cp "$RUNNER_TEMP/release/profile-manifest.json" "$RUNNER_TEMP/evidence/"
          shasum -a 256 "$RUNNER_TEMP/download/"*.dmg > "$RUNNER_TEMP/evidence/dmg.sha256"
          PACKAGE
          bash Packaging/with-apple-signing.sh bash Packaging/with-apple-notary.sh bash "$RUNNER_TEMP/package.sh" \
            2>&1 | tee "$RUNNER_TEMP/evidence/packaging.log"
          [[ -z $(find "$RUNNER_TEMP" -maxdepth 1 -type d \( -name 'aurora-signing.*' -o -name 'aurora-notary.*' \) -print) ]]
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-dmg-evidence
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: notarized-installer-dmg
          path: ${{ runner.temp }}/download/*.dmg
          if-no-files-found: error
          retention-days: 14
  prerelease:
    if: inputs.publish-release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require passing checks for this exact source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..80}; do
            checks=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow native-checks.yml \
              --commit "$GITHUB_SHA" --event push --limit 1 --json status,conclusion)
            status=$(jq -r '.[0].status // "pending"' <<< "$checks")
            if [[ $status == completed ]]; then
              [[ $(jq -r '.[0].conclusion' <<< "$checks") == success ]]
              exit
            fi
            sleep 15
          done
          echo "Native checks did not finish; withholding the release." >&2
          exit 1
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: notarized-installer-dmg
          path: download
      - name: Publish the notarized installer prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILES_REVISION: ${{ inputs.profiles-revision }}
          APP_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Native installer %s.\n\nSource: `%s`\nProfiles: `%s`\nBuild evidence: %s/%s/actions/runs/%s\n\nSigned and notarized DMG with nine sealed distribution catalogs. A NixOS KDE Reset and encrypted first boot passed on MacBook Neo; the other profiles still require physical installation qualification.\n' \
            "$APP_VERSION" "$GITHUB_SHA" "$PROFILES_REVISION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > notes.md
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]
          alpha_number=${RELEASE_TAG##*.}
          gh release create "$RELEASE_TAG" download/*.dmg --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "Aurora Installer $APP_VERSION Alpha $alpha_number" --notes-file notes.md
