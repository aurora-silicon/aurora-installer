name: Native Swift firmware extractor
on:
  push:
    branches: [feat/swift-native-installer, feat/native-firmware-resume]
    paths:
      - macOS/Sources/AuroraFirmware/**
      - macOS/Tests/AuroraFirmwareTests/**
      - macOS/Development/NativeFirmwareCheck/**
      - macOS/Package.swift
      - .github/workflows/native-firmware.yml
  workflow_dispatch:
    inputs:
      live-apple-extraction:
        description: Fetch only the sealed J700 firmware ranges from Apple (16 MB)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: macOS
    env:
      XCODEBUILDMCP_SENTRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned native build driver
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/evidence"
          cd "$RUNNER_TEMP/tools"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/getsentry/XcodeBuildMCP/releases/download/v2.7.0/xcodebuildmcp-2.7.0-darwin-arm64.tar.gz -o tool.tar.gz
          echo 'bd724a2c0e6ffe027b3f46257e66d626149a64cd045f4867124bd683b3cf081a  tool.tar.gz' | shasum -a 256 -c -
          tar -xzf tool.tar.gz
          echo "$PWD/xcodebuildmcp-2.7.0-darwin-arm64/bin" >> "$GITHUB_PATH"
      - name: Record source and native toolchain
        run: |
          { git rev-parse HEAD; sw_vers; uname -m; xcrun swift --version; xcodebuild -version; } > "$RUNNER_TEMP/evidence/toolchain.txt"
      - name: Check formatting and retain any correction
        id: format
        continue-on-error: true
        run: |
          set -euo pipefail
          xcrun swift-format format -i --recursive Package.swift Sources/AuroraFirmware Tests/AuroraFirmwareTests Development/NativeFirmwareCheck
          git diff --binary > "$RUNNER_TEMP/evidence/format.patch"
          git diff --exit-code
      - name: Test native crypto, transport, bounds and resume validation
        run: |
          set -euo pipefail
          xcodebuildmcp swift-package test --package-path "$PWD" --configuration debug --filter 'AuroraFirmwareTests' 2>&1 | tee "$RUNNER_TEMP/evidence/debug.log"
          xcodebuildmcp swift-package test --package-path "$PWD" --configuration release --filter 'AuroraFirmwareTests' 2>&1 | tee "$RUNNER_TEMP/evidence/release.log"
      - name: Exercise real partial extraction and independent reuse
        if: inputs.live-apple-extraction || github.event_name == 'push' 
        run: |
          set -euo pipefail
          xcrun swift build --configuration release --product AuroraFirmwareCheck
          binary="$(xcrun swift build --configuration release --show-bin-path)/AuroraFirmwareCheck"
          output="$RUNNER_TEMP/firmware-output"
          checkpoint="$RUNNER_TEMP/firmware-checkpoint"
          trap 'rm -rf "$output" "$checkpoint"' EXIT
          "$binary" extract "$output" "$checkpoint" > "$RUNNER_TEMP/evidence/extraction.json" 2> "$RUNNER_TEMP/evidence/progress.log"
          "$binary" verify "$output" > "$RUNNER_TEMP/evidence/reuse.json"
          cmp "$RUNNER_TEMP/evidence/extraction.json" "$RUNNER_TEMP/evidence/reuse.json"
          test -z "$(find "$checkpoint" -mindepth 1 -print -quit)"
      - name: Require clean source formatting
        if: always()
        run: test '${{ steps.format.outcome }}' = success
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-firmware-evidence
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
