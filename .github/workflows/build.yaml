name: build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    outputs:
      installer_ver:
        description: aurora-installer built version string
        value: ${{ jobs.build.outputs.installer_ver }}

jobs:
  build:
    runs-on: macos-26
    outputs:
      installer_ver: ${{ steps.compile.outputs.installer_ver }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Initialize Aurora m1n1
        run: git submodule update --init m1n1

      - name: Install build dependencies
        run: |
          brew install libarchive libxml2 p7zip wget llvm lld
          echo "$(brew --prefix libarchive)/bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/aurora-python"
          "$RUNNER_TEMP/aurora-python/bin/python" -m pip install certifi
          echo "$RUNNER_TEMP/aurora-python/bin" >> "$GITHUB_PATH"
          rustup target install aarch64-unknown-none-softfloat

      - name: Build aurora-installer
        id: compile
        run: |
          ./build.sh
          echo "installer_ver=$(cat releases/latest).tar.gz" >> $GITHUB_OUTPUT

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: installer-build
          path: |
            releases/*
