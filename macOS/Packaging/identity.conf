# Installer identity and hosting: the only place these values are set.
# Packaging, release scripts, tests and the Swift build (through the
# OmarchyInstallerIdentityPlugin) all read this file, so changing a value here
# and rebuilding changes the app. Regenerate Release/release.json with
# scripts/make-release-descriptor after changing the helper, team, trust root
# or public base; test/all checks that it and Release/trust-root.ed25519.pub
# match these values.
#
# Format: NAME="value" lines, comments and blank lines only. Names start with
# INSTALLER_. Values are non-empty and contain no ", \, $ or `.

# App bundle, privileged helper and installer package.
INSTALLER_APP_NAME="Aurora Installer"
INSTALLER_FILE_STEM="Aurora-MX-Mac-Installer"
INSTALLER_APP_IDENTIFIER="org.aurorasilicon.installer"
INSTALLER_HELPER_IDENTIFIER="org.aurorasilicon.installer.helper"
INSTALLER_PKG_IDENTIFIER="org.aurorasilicon.installer.pkg"
# The app name before the rename: the package removes a leftover copy and
# preclean-m1.sh still recognises it on test Macs.
INSTALLER_LEGACY_APP_NAME="Aurora MX Mac Installer"

# Apple Developer team and the Developer ID identities it issued.
INSTALLER_TEAM_ID="UNSIGNED00"
INSTALLER_APP_SIGNING_IDENTITY="-"
INSTALLER_PKG_SIGNING_IDENTITY="-"

# Catalog trust root: the SHA-256 of Release/trust-root.ed25519.pub and the Keychain service holding its private key.
INSTALLER_TRUST_ROOT_FINGERPRINT="sha256:124640d0587aa55701a6d3a52b7243f500f13261004eccafd696ac234e4b99e7"
INSTALLER_CATALOG_KEY_SERVICE="aurora-installer-signing-key"

# Catalog and download hosting. This installer's release stream (channel
# catalogs, release sets and installer downloads) lives under the stream path
# of the public base. The MX Mac feeds at the root of the bucket belong to the
# MX Mac installer; nothing here reads, writes or prunes them.
INSTALLER_PUBLIC_BASE="https://releases.aurora.invalid"
INSTALLER_STREAM_PATH="installer"
INSTALLER_R2_BUCKET="aurora-installer"
INSTALLER_R2_ENDPOINT="https://storage.aurora.invalid"
INSTALLER_GITHUB_RELEASE_REPO="aurora-silicon/aurora-installer"
INSTALLER_GITHUB_RELEASE_LOGIN="aurora-silicon"
